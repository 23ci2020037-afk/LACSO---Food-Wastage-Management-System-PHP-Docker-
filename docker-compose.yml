version: '3.8'

services:
  web:
    build: .
    container_name: lacso_web
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpass
      - DB_NAME=lacso_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: lacso_db_container
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=lacso_db
    volumes:
      - db_data:/var/lib/mysql
      - ./database_setup.sql:/docker-entrypoint-initdb.d/database_setup.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lacso_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=rootpass
    depends_on:
      - db

volumes:
  db_data:
