<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacso - Feedback</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-green-600 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 w-full max-w-lg shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="ri-feedback-line text-green-600 text-4xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Your Feedback Matters!</h1>
            <p class="text-gray-500">Help us improve the food saving mission.</p>
        </div>

        <form class="space-y-6">
            <div>
                <label class="block text-gray-700 font-medium mb-2">How was your experience?</label>
                <div class="flex justify-between text-3xl text-gray-300">
                    <i class="ri-star-line hover:text-yellow-400 cursor-pointer transition"></i>
                    <i class="ri-star-line hover:text-yellow-400 cursor-pointer transition"></i>
                    <i class="ri-star-line hover:text-yellow-400 cursor-pointer transition"></i>
                    <i class="ri-star-line hover:text-yellow-400 cursor-pointer transition"></i>
                    <i class="ri-star-line hover:text-yellow-400 cursor-pointer transition"></i>
                </div>
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">Feedback Details</label>
                <textarea class="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-green-500 h-32" placeholder="Tell us more..."></textarea>
            </div>

            <button type="submit" class="w-full py-4 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 transition shadow-lg">Submit Feedback</button>
            <a href="donor.html" class="block text-center text-gray-400 text-sm hover:underline">Back to Dashboard</a>
        </form>
    </div>
</body>
</html>
