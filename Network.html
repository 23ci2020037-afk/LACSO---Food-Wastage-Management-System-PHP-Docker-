<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacso - Community Network</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-4xl mx-auto p-8">
        <header class="mb-12 flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-bold text-gray-900 mb-2">Impact Network 🌍</h1>
                <p class="text-gray-600 italic">Connected heroes saving food together.</p>
            </div>
            <a href="donor.html" class="px-6 py-3 bg-green-100 text-green-700 rounded-xl font-bold flex items-center gap-2 hover:bg-green-200 transition">
                <i class="ri-arrow-left-line"></i> Dashboard
            </a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2 text-green-600"><i class="ri-user-follow-line"></i> Top Contributors</h2>
                <div class="space-y-6" id="network-list">
                    <div class="flex items-center gap-4 group cursor-pointer hover:bg-gray-50 p-2 rounded-xl transition">
                        <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">SJ</div>
                        <div class="flex-1">
                            <p class="font-bold text-gray-800">Sarah Johnson</p>
                            <p class="text-xs text-gray-400 font-medium tracking-wide uppercase">Donor • 25 Donations</p>
                        </div>
                        <div class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold">Pro</div>
                    </div>
                </div>
            </div>

            <div class="bg-green-600 p-8 rounded-3xl text-white shadow-xl flex flex-col justify-between">
                <div>
                    <h2 class="text-2xl font-bold mb-4">Total Network Impact</h2>
                    <p class="text-green-100 text-lg">We have collectively saved over <span class="text-white font-bold text-3xl block mt-2">1,250 KG</span> of food this month!</p>
                </div>
                <div class="mt-8">
                    <button class="w-full py-4 bg-white text-green-600 rounded-2xl font-bold shadow-lg hover:bg-green-50 transition">Invite Friends</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
