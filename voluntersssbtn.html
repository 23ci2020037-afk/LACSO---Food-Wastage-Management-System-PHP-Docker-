<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacso - Volunteer Tasks</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="bg-[#f0f4f1] min-h-screen">
    <div class="max-w-6xl mx-auto p-4 py-10">
        <header class="flex justify-between items-end mb-10 px-4">
            <div>
                <h1 class="text-4xl font-black text-gray-900 tracking-tight">Active Deliveries 🚀</h1>
                <p class="text-green-700 font-medium">Real-time donation requests in your area</p>
            </div>
            <div class="flex items-center gap-3 bg-white p-3 rounded-2xl shadow-sm border border-green-100">
                <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center text-green-600 font-bold">V1</div>
                <div>
                    <p class="text-xs text-gray-400 font-bold uppercase">Points</p>
                    <p class="text-sm font-bold text-gray-900">1,250 pts</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="tasks-list">
            <!-- Dynamic Tasks will be loaded here -->
        </div>
    </div>

    <script>
        function loadTasks() {
            const container = document.getElementById('tasks-list');
            const donations = JSON.parse(localStorage.getItem('activeDonations') || '[]');
            
            if (donations.length === 0) {
                container.innerHTML = '<div class="col-span-full py-20 text-center"><i class="ri-search-line text-4xl text-gray-300"></i><p class="text-gray-400 mt-2">No active donation requests at the moment.</p></div>';
                return;
            }

            container.innerHTML = '';
            donations.forEach((task, index) => {
                if (task.status === 'Delivered') return;

                const card = document.createElement('div');
                card.className = "task-card bg-white rounded-[32px] p-8 shadow-xl border-4 border-white transition-all duration-500 hover:border-green-400";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div class="px-4 py-1.5 bg-green-50 text-green-700 rounded-full text-[10px] font-black uppercase tracking-widest">New Priority</div>
                        <span class="text-gray-400 text-xs font-medium">${task.time}</span>
                    </div>
                    <h3 class="text-2xl font-black text-gray-900 mb-2">${task.foodName}</h3>
                    <p class="text-3xl font-bold text-green-600 mb-6">${task.quantity}</p>
                    
                    <div class="space-y-4 mb-8">
                        <div class="flex items-center gap-4 group">
                            <div class="w-10 h-10 bg-gray-50 rounded-2xl flex items-center justify-center group-hover:bg-green-100 transition">
                                <i class="ri-user-smile-line text-green-600"></i>
                            </div>
                            <div>
                                <p class="text-[10px] text-gray-400 font-bold uppercase">Donor</p>
                                <p class="text-sm font-bold text-gray-800">${task.donorName}</p>
                            </div>
                        </div>
                    </div>

                    <button onclick="acceptTask(${index}, this)" 
                        class="w-full py-4 ${task.status === 'Accepted' ? 'bg-orange-500' : 'bg-black'} text-white rounded-2xl font-bold transition-all active:scale-95 shadow-lg shadow-gray-200">
                        ${task.status === 'Accepted' ? 'Track Progress' : 'Accept Delivery'}
                    </button>
                `;
                container.appendChild(card);
            });

            gsap.from(".task-card", {
                y: 50,
                opacity: 0,
                stagger: 0.15,
                duration: 1,
                ease: "expo.out"
            });
        }

        function acceptTask(index, btn) {
            let donations = JSON.parse(localStorage.getItem('activeDonations') || '[]');
            donations[index].status = 'Accepted';
            localStorage.setItem('activeDonations', JSON.stringify(donations));
            
            btn.innerHTML = 'Starting Delivery...';
            btn.classList.replace('bg-black', 'bg-orange-500');
            
            setTimeout(() => {
                alert("Delivery sequence started! The donor has been notified.");
                window.location.reload();
            }, 500);
        }

        window.onload = loadTasks;
    </script>
</body>
</html>
