<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volunteer - My Tasks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Fade-in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.6s ease-in-out forwards;
    }
    /* Card hover animation */
    .task-card:hover {
      transform: translateY(-5px);
      transition: all 0.3s ease;
    }
    /* Progress bar animation */
    .progress-bar {
      transition: width 1s ease-in-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-orange-50 to-yellow-100 min-h-screen flex flex-col items-center font-sans">

  <!-- Header -->
  <header class="w-full bg-white shadow p-4 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="voluntersssbtn.html" class="text-orange-600 hover:text-orange-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </a>
      <h1 class="text-2xl font-bold text-orange-600">📋 My Tasks</h1>
    </div>
    <button class="bg-orange-500 text-white px-4 py-2 rounded-lg shadow hover:bg-orange-600 transition">
      + New Task
    </button>
  </header>

  <!-- Progress Section -->
  <section class="mt-6 w-11/12 max-w-5xl">
    <div class="bg-white rounded-2xl shadow p-6 fade-in">
      <h2 class="text-lg font-semibold mb-3">This Week's Progress</h2>
      <div class="flex items-center justify-between">
        <div class="w-full bg-gray-200 rounded-full h-3">
          <div class="bg-green-500 h-3 rounded-full progress-bar" style="width: 70%;"></div>
        </div>
        <span class="ml-4 font-semibold text-green-600">70%</span>
      </div>
    </div>
  </section>

  <!-- Task Categories -->
  <section class="mt-6 w-11/12 max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Pending Tasks -->
    <div class="bg-white rounded-2xl shadow p-5 fade-in">
      <h3 class="text-xl font-bold text-yellow-600 mb-3">⏳ Pending</h3>

      <div class="task-card bg-yellow-50 p-4 rounded-xl shadow-sm mb-3 cursor-pointer">
        <h4 class="font-semibold">🍴 Food Pickup - Green Market</h4>
        <p class="text-sm text-gray-600">📍 2.5 km | 15 kg</p>
        <p class="text-sm text-gray-600">🕒 10:30 AM – 11:30 AM</p>
        <button class="mt-3 px-3 py-1 bg-yellow-500 text-white rounded-lg text-sm hover:bg-yellow-600 transition">
          Start Task
        </button>
      </div>
    </div>

    <!-- In Progress -->
    <div class="bg-white rounded-2xl shadow p-5 fade-in">
      <h3 class="text-xl font-bold text-blue-600 mb-3">🚀 In Progress</h3>

      <div class="task-card bg-blue-50 p-4 rounded-xl shadow-sm mb-3 cursor-pointer">
        <h4 class="font-semibold">🥖 Food Distribution - City Shelter</h4>
        <p class="text-sm text-gray-600">📍 5 km away</p>
        <p class="text-sm text-gray-600">🕒 12:00 PM – 2:00 PM</p>
        <button class="mt-3 px-3 py-1 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600 transition">
          Mark as Completed
        </button>
      </div>
    </div>

    <!-- Completed -->
    <div class="bg-white rounded-2xl shadow p-5 fade-in">
      <h3 class="text-xl font-bold text-green-600 mb-3">✅ Completed</h3>

      <div class="task-card bg-green-50 p-4 rounded-xl shadow-sm mb-3 cursor-pointer">
        <h4 class="font-semibold">🍎 Pickup - Fresh Harvest</h4>
        <p class="text-sm text-gray-600">📍 1.8 km | 20 kg</p>
        <p class="text-sm text-gray-600">🕒 Completed Yesterday</p>
        <span class="mt-3 inline-block px-3 py-1 bg-green-500 text-white rounded-lg text-sm">
          Completed
        </span>
      </div>
    </div>

  </section>

</body>
</html>
